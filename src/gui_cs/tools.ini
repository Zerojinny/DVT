; ============================================================
;  DVT GUI - tools.ini : data of the "WinPE tools" tab
;
;  Embedded in DVT_GUI.exe by build_gui.bat. A copy of this file in
;  gui_cs\ (or next to DVT_GUI.exe) replaces the embedded one, so a
;  new release can be added without rebuilding.
;
;  One section per tool:
;    name        shown on the page
;    version     release that url points to
;    url         https download of the zip file
;    sha256      SHA256 of that zip file
;    on_mismatch refuse = never use a file with another hash
;                ask    = show the hash and ask (for an url without a
;                         version, whose file changes with every release)
;    hosts       hosts the download may come from (after redirects)
;    files       files taken from the zip (found anywhere inside it);
;                * = every file of the zip (copied without its folders)
;    check       files that must exist for the tool to count as present
;                (default: the names in files)
;    target      PE_TOOLS_DIR = the PE_TOOLS_DIR folder of host\config.cmd
;                NIRCMD       = the folder of NIRCMD_SRC (NirCmd is kept in
;                               PE_TOOLS_DIR since DVT v0.3.0)
;    home        project page (opened from the page)
;
;  URLs and hashes as published in the Scoop manifests
;  (ScoopInstaller/Main: aria2.json, wimlib.json, nircmd.json); the
;  aria2 and NirCmd hashes also match Npackd / Chocolatey.
; ============================================================

[aria2]
name = aria2
version = 1.37.0
url = https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip
sha256 = 67D015301EEF0B612191212D564C5BB0A14B5B9C4796B76454276A4D28D9B288
on_mismatch = refuse
hosts = github.com objects.githubusercontent.com release-assets.githubusercontent.com
files = aria2c.exe
target = PE_TOOLS_DIR
home = https://github.com/aria2/aria2
license = GPL-2.0

[wimlib]
name = wimlib
version = 1.14.5
url = https://wimlib.net/downloads/wimlib-1.14.5-windows-x86_64-bin.zip
sha256 = 2F446D6FA3866582175F1A22A7BE198EEEE0AEC7ABA5B4E04AD25C99EAE2D265
on_mismatch = refuse
hosts = wimlib.net
files = wimlib-imagex.exe libwim-15.dll
target = PE_TOOLS_DIR
home = https://wimlib.net
license = LGPL-3.0 / GPL-3.0

[nircmd]
name = NirCmd (x64)
version = 2.87
url = https://www.nirsoft.net/utils/nircmd-x64.zip
sha256 = 51E34ED379DD099A96BBF0A2266003361E2864FE3EF2F8BAED76634909763A7C
on_mismatch = ask
hosts = www.nirsoft.net nirsoft.net
; every file of the zip: nircmd.exe, nircmdc.exe, NirCmd.chm
files = *
check = nircmd.exe
target = PE_TOOLS_DIR
home = https://www.nirsoft.net/utils/nircmd.html
license = Freeware (NirSoft)

; ============================================================
;  Settings of the config.cmd files
;  [setting <file>:<NAME>] is used before [setting <NAME>].
;  <file> = host (data\host\config.cmd), pe (data\pe\config.cmd),
;           media (data\Media\config.cmd),
;           mediape (data\Media\pe\config.cmd), test (test_config.cmd)
;    summary   = one line, shown in the grid
;    details   = shown below the grid (details += for more lines)
;    advanced  = 1 : usually left as it is, hidden until "Show advanced"
;    choice X  = meaning of the value X (drop-down list)
;  The value X and "advanced" are taken from en.ini; another language
;  file only needs to translate the text.
; ============================================================

; ============================================================
; data\host\config.cmd
; ============================================================

[setting host:WORK_DIR]
summary = Working folder on the client PC
details = make_boot.bat looks for the torrent here and keeps its files here: ip.txt, the exported network drivers and the ID of the boot entry.
details += Default C:\temp. Copy DVT_backup.torrent into this folder on every client.

[setting host:BOOT_WIM]
summary = WinPE image that the client boots once
advanced = 1
details = The boot.wim next to make_boot.bat (C:\temp\boot or C:\temp\boot_test). make_boot.bat adds the drivers, IP, torrent and disk ID to it.

[setting host:TORRENT]
summary = Torrent file that is put into the image
details = make_boot.bat copies this file into boot.wim. Default: C:\temp\DVT_backup.torrent.
details += make_boot.bat stops if it is missing.

[setting host:IP_FILE]
summary = Static IP file written on the client
advanced = 1
details = Written only when the client uses a static IP address, then copied into the image. With DHCP no file is written and WinPE uses DHCP too.
details += Line 1 = ip, 2 = subnet, 3 = gateway, 4-5 = DNS servers.

[setting host:NETDRV_DIR]
summary = Folder for the exported network drivers
advanced = 1
details = The network drivers of the running Windows are exported here and added to boot.wim, so WinPE can use the same network card. Emptied on every run.

[setting host:NETDRV_EXCLUDE]
summary = Network drivers that are NOT exported
details = A PowerShell regular expression matched against the manufacturer and the device name. Use | for several, e.g. Realtek|Killer.
details += Default Realtek: the Windows Realtek driver can drop the connection in WinPE, so the WinPE driver in the drivers folder is used instead.
details += Empty = export every network driver.

[setting host:BOOT_MOUNT_DIR]
summary = Local folder where boot.wim is mounted
advanced = 1
details = Must be on a local NTFS drive and never in a folder synced by OneDrive, Dropbox etc. A stale mount there is discarded first.

[setting host:DISK_ID_NAME]
summary = File name of the disk ID inside the image
advanced = 1
details = The disk ID of the Windows disk (GPT GUID or MBR signature) is written to restore\<this name>. WinPE erases the disk with this ID. Keep it equal to DISK_ID_FILE in data\pe\config.cmd.

[setting host:BITLOCKER_SUSPEND]
summary = Suspend BitLocker for one restart
details = When a check in WinPE fails, the PC goes back to its Windows. Suspending BitLocker for one restart avoids the recovery key prompt then. The protection turns back on by itself.
choice 1 = suspend for one restart (recommended)
choice 0 = leave BitLocker as it is

[setting host:BOOT_ENTRY_NAME]
summary = Name of the one-time boot menu entry
details = Shown in the Windows boot menu while the client restarts into WinPE.

[setting host:BOOT_MENU_TIMEOUT]
summary = Boot menu wait time in seconds
details = Set with 'bcdedit /timeout' on the client. This is the wait time of the Windows boot manager of that PC.

[setting host:BCD_CLEANUP_MODE]
summary = How the one-time boot entry is removed
details = The entry boots WinPE once; this decides who deletes it afterwards.
choice 2 = on the next Windows boot (scheduled task, image unchanged)
choice 1 = from inside WinPE (adds a command to startnet.cmd)
choice 0 = not removed

[setting host:BCD_TASK_NAME]
summary = Name of the cleanup scheduled task
advanced = 1
details = Used only with BCD_CLEANUP_MODE=2. The task deletes the boot entry at the next start and then itself.

[setting host:BCD_GUID_FILE]
summary = File that keeps the ID of the boot entry
advanced = 1
details = Lets a later run of make_boot.bat find and replace an old DVT boot entry.

[setting host:REBOOT_DELAY_SEC]
summary = Seconds before the client restarts into WinPE
details = After the large IP display, a key starts the restart; this is the delay of 'shutdown /r'.

[setting host:ADK_PE_DIR]
summary = WinPE folder of the Windows ADK
advanced = 1
details = Used only while source\winpe.wim and source\boot.sdi do not exist yet (first build). Change it when the ADK is installed in another folder.

[setting host:PE_LANG]
summary = Language folder of winpe.wim in the ADK
advanced = 1
details = Read only on the first build. To switch, delete source\winpe.wim so a new copy is taken from the ADK.
choice en-us = English (default)
choice ko-kr = Korean

[setting host:PE_SRC_DIR]
summary = WinPE scripts of the client local boot
advanced = 1
details = Copied to X:\restore of the image. Leave as it is.

[setting host:PE_COMMON_DIR]
summary = WinPE scripts shared by all images
advanced = 1
details = Copied to X:\restore after PE_SRC_DIR. Leave as it is.

[setting host:PE_COMMON_FILES]
summary = Files that must exist in PE_COMMON_DIR
advanced = 1
details = Checked before a build. Leave as it is.

[setting host:PE_TOOLS_DIR]
summary = Tools copied into WinPE (X:\restore)
details = Put aria2c.exe, wimlib-imagex.exe, libwim-15.dll and nircmd.exe (x64) here (the WinPE tools tab downloads them). The build stops when aria2c.exe, wimlib-imagex.exe or nircmd.exe is missing.

[setting host:PE_SYS32_DIR]
summary = Optional files copied to X:\Windows\System32
advanced = 1
details = Anything WinPE should find on its PATH. The folder may be missing.

[setting host:PE_DRIVERS_DIR]
summary = Drivers added to every WinPE image
details = All .inf drivers below this folder are added with DISM (e.g. the WinPE Realtek driver). Network drivers of each client are added later by make_boot.bat.

[setting host:NIRCMD_SRC]
summary = nircmd.exe (x64), copied to X:\Windows\System32
advanced = 1
details = Used by WinPE to show messages and to stop aria2c. Required. Kept in PE_TOOLS_DIR with the other tools (the WinPE tools tab downloads it there); before v0.3.0 it was in nircmd-x64\.

[setting host:SOURCE_DIR]
summary = Stored clean ADK files
advanced = 1
details = winpe.wim, boot.sdi, adk_media and adk_tools. After the first build the ADK is not needed. Delete a file here to copy it from the ADK again.

[setting host:OUT_ROOT]
summary = Folder of all build results
advanced = 1
details = _output\boot, _output\boot_test and _output\media are created here.

[setting host:OUT_DIR]
summary = Result of 01_make_pe.bat
advanced = 1
details = boot.wim, boot.sdi and the client scripts. Copy this folder to C:\temp\boot on the clients.

[setting host:BUILD_LOCAL]
summary = Local work folder of the builds
advanced = 1
details = Mount and work folders. Must be on a local drive and never in a synced folder (sync clients can bring deleted files back).

[setting host:PE_SCRATCH_MB]
summary = WinPE scratch space in MB
advanced = 1
details = RAM drive size of X:. 512 is the maximum and the best for aria2c and wimlib.
choice 512 = maximum (recommended)
choice 256 = 
choice 128 = 
choice 64 = 
choice 32 = 

[setting host:DISM]
summary = Path of dism.exe
advanced = 1
details = Leave as it is.

[setting host:BCDEDIT]
summary = Path of bcdedit.exe
advanced = 1
details = Leave as it is.

[setting host:PNPUTIL]
summary = Path of pnputil.exe
advanced = 1
details = Leave as it is.

[setting host:MANAGEBDE]
summary = Path of manage-bde.exe
advanced = 1
details = Leave as it is.

[setting host:COLOR_LINK_1G]
summary = Console color: link 1 Gbps or faster
details = Color of make_boot.bat after the link speed check, visible at a glance in Veyon.
details += Two hex digits: background, then text (as in 'color /?').
details += 0 black  1 blue  2 green  3 aqua  4 red  5 purple  6 yellow  7 white
details += 8 gray   9 light blue  A light green  B light aqua  C light red
details += D light purple  E light yellow  F bright white.   Example: 2F = white on green.

[setting host:COLOR_LINK_100M]
summary = Console color: link 100 Mbps
details = Color of make_boot.bat after the link speed check.
details += Two hex digits: background, then text (as in 'color /?').
details += 0 black  1 blue  2 green  3 aqua  4 red  5 purple  6 yellow  7 white
details += 8 gray   9 light blue  A light green  B light aqua  C light red
details += D light purple  E light yellow  F bright white.   Example: 2F = white on green.

[setting host:COLOR_LINK_SLOW]
summary = Console color: slower or unknown link
details = Color of make_boot.bat when the link is slower than 100 Mbps or unknown.
details += Two hex digits: background, then text (as in 'color /?').
details += 0 black  1 blue  2 green  3 aqua  4 red  5 purple  6 yellow  7 white
details += 8 gray   9 light blue  A light green  B light aqua  C light red
details += D light purple  E light yellow  F bright white.   Example: 2F = white on green.

[setting COLOR_OK]
summary = Console color: success
advanced = 1
details = Two hex digits: background, then text (as in 'color /?').
details += 0 black  1 blue  2 green  3 aqua  4 red  5 purple  6 yellow  7 white
details += 8 gray   9 light blue  A light green  B light aqua  C light red
details += D light purple  E light yellow  F bright white.   Example: 2F = white on green.

[setting COLOR_FAIL]
summary = Console color: failure
advanced = 1
details = Two hex digits: background, then text (as in 'color /?').
details += 0 black  1 blue  2 green  3 aqua  4 red  5 purple  6 yellow  7 white
details += 8 gray   9 light blue  A light green  B light aqua  C light red
details += D light purple  E light yellow  F bright white.   Example: 2F = white on green.

; ============================================================
; data\pe\config.cmd
; ============================================================

[setting TORRENT]
summary = Torrent file inside WinPE
advanced = 1
details = Location in X:\restore. Leave as it is.

[setting ARIA2_CONF]
summary = aria2 settings file inside WinPE
advanced = 1
details = Created from aria2.conf.1G or aria2.conf.100 by the link speed. Leave as it is.

[setting LINK_FILE]
summary = Link speed profile file inside WinPE
advanced = 1
details = Written by make_boot.bat (1G or 100). Leave as it is.

[setting DL_NAME]
summary = Top folder name inside the torrent
details = Must match the folder you made the torrent from (default DVT_backup). WinPE downloads to <drive>:\DL_NAME.

[setting WIM_NAME]
summary = Image file inside that folder
details = The backup image to restore (default backup.wim).

[setting WIM_INDEX]
summary = Image index to restore (1 = first)
details = For a WIM with several images. List them with: wimlib-imagex info backup.wim

[setting pe:IP_FILE]
summary = Static IP file inside WinPE
advanced = 1
details = Copied by make_boot.bat only for a static IP. Leave as it is.

[setting RESTORE_FLAG]
summary = Flag file: download completed
advanced = 1
details = Internal. Leave as it is.

[setting ARIA2]
summary = Path of aria2c.exe in WinPE
advanced = 1
details = X:\restore first, then System32. Leave as it is.

[setting WIMLIB]
summary = Path of wimlib-imagex.exe in WinPE
advanced = 1
details = X:\restore first, then System32. Leave as it is.

[setting NIRCMD]
summary = Path of nircmd.exe in WinPE
advanced = 1
details = X:\restore first, then System32. Leave as it is.

[setting pe:FORCE_DISK]
summary = Disk number to erase (empty = automatic)
details = DANGEROUS. Empty = find the Windows disk by its disk ID (recommended).
details += A number erases that disk on EVERY client. Use it only when all PCs have the same disk layout.

[setting pe:DISK_ID_FILE]
summary = Disk ID file inside WinPE
advanced = 1
details = Written by make_boot.bat. Keep it equal to DISK_ID_NAME in data\host\config.cmd.

[setting pe:AUTO_DISK_FALLBACK]
summary = When no disk matches the disk ID
details = Instant recovery programs can hide the real disk ID and show the Windows partition as RAW in WinPE.
choice 1 = use the only RAW volume's disk, or the only disk
choice 0 = stop: the disk ID (or FORCE_DISK) is required

[setting TDRV]
summary = Drive letter of the new Windows partition in WinPE
advanced = 1
details = Also used for the download. Leave as it is unless it collides with another drive.

[setting SDRV]
summary = Drive letter of the new system (boot) partition in WinPE
advanced = 1
details = Leave as it is unless it collides with another drive.

[setting EFI_SIZE_MB]
summary = EFI system partition size (UEFI) in MB
advanced = 1
details = Default 260 (fits 4K-sector disks).

[setting MSR_SIZE_MB]
summary = Microsoft reserved partition size (UEFI) in MB
advanced = 1
details = Default 16.

[setting BIOS_SYS_SIZE_MB]
summary = System partition size (BIOS / MBR) in MB
advanced = 1
details = Default 500.

[setting NET_MASK]
summary = Subnet mask used when ip.txt has none
details = Used only when ip.txt has no line 2.

[setting NET_DNS1]
summary = DNS server 1 used when ip.txt has none
details = Used only when ip.txt has no DNS lines (4-5).

[setting NET_DNS2]
summary = DNS server 2 used when ip.txt has none
details = Used only when ip.txt has no DNS lines (4-5).

[setting NET_TEST_HOST]
summary = Extra host that must answer (ping)
details = Before a static-IP network card is accepted, this host must answer besides the gateway. Use the tracker or seeder address, not an internet address. Empty = gateway only.

[setting SET_IP_RETRIES]
summary = Static IP: rounds over all network cards
details = When no card reaches the gateway, all cards are tried again this many times.

[setting SET_IP_RETRY_SEC]
summary = Static IP: wait between the rounds (seconds)

[setting DHCP_WAIT_TRIES]
summary = DHCP: tries of 2 seconds for an address
details = 30 tries = 60 seconds.

[setting CHECK_FILE]
summary = Small test file inside the torrent
advanced = 1
details = Downloaded first to prove a seeder answers, before anything is erased. Put it (a few KB, never empty) in the DL_NAME folder before making the torrent.

[setting SEEDER_TIMEOUT_SEC]
summary = Seeder check: timeout per try (seconds)
details = How long one try waits for the test file from a seeder.

[setting SEEDER_TRIES_1G]
summary = Seeder check: tries on a 1 Gbps link

[setting SEEDER_TRIES_100]
summary = Seeder check: tries on 100 Mbps or unknown

[setting SEEDER_LOG]
summary = aria2c log of the seeder check
advanced = 1
details = Kept for troubleshooting.

[setting SEEDER_EXTRA_OPTS]
summary = Extra aria2c options for the seeder check
advanced = 1
details = Example: --bt-tracker=http://192.168.0.10:9000/announce

[setting SPACE_CHECK]
summary = Disk space check before erasing
details = Compares the disk size with the image size (APPLIED_SIZE_MB or the estimate) plus SPACE_MARGIN_MB.
choice 1 = stop when the disk is too small
choice 2 = only warn
choice 0 = no check

[setting APPLIED_SIZE_MB]
summary = Size of the applied image in MB (empty = estimate)
details = For the exact value run 'wimlib-imagex info backup.wim 1' and use Total Bytes / 1048576.

[setting APPLIED_SIZE_PCT]
summary = Estimate: percent of the download size
details = Used when APPLIED_SIZE_MB is empty. 200 = twice the compressed image.

[setting SPACE_MARGIN_MB]
summary = Space kept free on the Windows partition (MB)

[setting BCD_LOCALE]
summary = Language of the restored boot menu
details = Passed to 'bcdboot /l' when the boot files of the restored Windows are written.
choice ko-kr = Korean
choice en-us = English

[setting FAIL_REBOOT_SEC]
summary = Seconds before a reboot after a failure
details = The PC returns to its old Windows when nothing was erased yet.

[setting DONE_REBOOT_SEC]
summary = Seconds before the reboot after the restore

[setting COLOR_WORK]
summary = Console color: WinPE checks running
advanced = 1
details = Two hex digits: background, then text (as in 'color /?').
details += 0 black  1 blue  2 green  3 aqua  4 red  5 purple  6 yellow  7 white
details += 8 gray   9 light blue  A light green  B light aqua  C light red
details += D light purple  E light yellow  F bright white.   Example: 2F = white on green.

[setting COLOR_RESTORE]
summary = Console color: WinPE download and restore
advanced = 1
details = Two hex digits: background, then text (as in 'color /?').
details += 0 black  1 blue  2 green  3 aqua  4 red  5 purple  6 yellow  7 white
details += 8 gray   9 light blue  A light green  B light aqua  C light red
details += D light purple  E light yellow  F bright white.   Example: 2F = white on green.

; ============================================================
; data\Media\pe\config.cmd
; ============================================================

[setting mediape:BASEIP_FILE]
summary = Static IP base file inside WinPE
advanced = 1
details = <media>\config\ip.txt, copied at boot. Leave as it is.

[setting mediape:IP_FILE]
summary = Final IP settings of this PC
advanced = 1
details = Written by start_media.bat, moved to T:\temp\ip.txt by the restore. Leave as it is.

[setting mediape:FORCE_DISK]
summary = Disk number to erase (empty = ask at each PC)
details = Empty = the operator chooses the disk at each PC.
details += Set = the operator types only the last IP octet; if that disk is missing or is the boot media, the disk is asked. MEDIA_CONFIRM still asks before erasing.

[setting mediape:DHCP_ENABLE]
summary = Which network is tried first
details = Without ip.txt on the media, DHCP is always used.
choice 0 = static IP (ip.txt) first, DHCP if its gateway test fails
choice 1 = DHCP first, static IP (ip.txt) if DHCP fails

[setting mediape:DHCP_FIRST_TRIES]
summary = DHCP first: tries of 2 seconds
details = With DHCP_ENABLE=1 and ip.txt. 20 tries = 40 seconds (covers a slow switch port).

[setting mediape:DHCP_FALLBACK_CONFIRM]
summary = Static IP failed but DHCP works
choice 0 = continue with DHCP without a question
choice 1 = ask the operator Y/N first

[setting mediape:DONE_REBOOT_SEC]
summary = Seconds before the reboot after the restore
details = Longer than the local boot: time to remove the USB drive or CD.

[setting mediape:LINK_EXE]
summary = link.exe inside WinPE
advanced = 1
details = Chooses aria2.conf.1G or aria2.conf.100 by the link speed. Leave as it is.

[setting mediape:LINK_FALLBACK]
summary = aria2 profile when link.exe fails
choice 100 = 100 Mbps settings (safe)
choice 1G = 1 Gbps settings

[setting mediape:OCTET_MIN]
summary = Lowest last IP octet accepted
details = The operator types the last octet of the static IP at each PC.

[setting mediape:OCTET_MAX]
summary = Highest last IP octet accepted

[setting mediape:MEDIA_CONFIRM]
summary = Ask before the selected disk is erased
choice 1 = ask Y/N (recommended)
choice 0 = no question

; ============================================================
; data\Media\config.cmd
; ============================================================

[setting media:MEDIA_PE_DIR]
summary = WinPE scripts of the media image
advanced = 1
details = data\Media\pe. Leave as it is.

[setting media:MEDIA_CONFIG_DIR]
summary = Files copied to <media>\config
advanced = 1
details = ip.txt, aria2.conf.*, DVT_backup.torrent. Edit them in the tabs 'Static IP' and 'Torrent and aria2'.

[setting media:MEDIA_FILES_DIR]
summary = Stored ADK media files
advanced = 1
details = Copied from the ADK on the first run.

[setting media:MEDIA_TOOLS_DIR]
summary = Stored ADK tools
advanced = 1
details = oscdimg.exe, etfsboot.com, efisys.bin, bootsect.exe.

[setting media:MEDIA_OUT_DIR]
summary = Folder of the media results
advanced = 1
details = boot.wim of the media and the ISO file.

[setting media:MEDIA_WIM]
summary = boot.wim of the media
advanced = 1
details = Reused by later runs when you answer N to the rebuild question.

[setting media:MEDIA_ISO]
summary = ISO file that is created
details = Burn it to a CD / DVD or write it with Rufus.

[setting media:MEDIA_WORK]
summary = Local work folder
advanced = 1
details = Never in a synced folder.

[setting media:MEDIA_MOUNT]
summary = Local mount folder
advanced = 1
details = Never in a synced folder.

[setting media:MEDIA_STAGE]
summary = Local folder where the media files are assembled
advanced = 1
details = Never in a synced folder.

[setting media:LINK_EXE]
summary = 64-bit link.exe for the media
advanced = 1
details = Required. It must be a 64-bit program (WinPE x64 has no 32-bit support).

[setting media:ADK_MEDIA_DIR]
summary = ADK Media folder (first run only)
advanced = 1

[setting media:ADK_OSCDIMG_DIR]
summary = ADK Oscdimg folder (first run only)
advanced = 1

[setting media:ADK_BOOTSECT]
summary = ADK bootsect.exe (first run only)
advanced = 1

[setting media:OSCDIMG]
summary = Stored oscdimg.exe
advanced = 1
details = Makes the ISO file.

[setting media:ETFSBOOT]
summary = Stored BIOS boot sector of the ISO
advanced = 1

[setting media:EFISYS]
summary = Stored UEFI boot sector of the ISO
advanced = 1
details = efisys_noprompt.bin renamed: the CD boots without 'Press any key'.

[setting media:BOOTSECT]
summary = Stored bootsect.exe
advanced = 1
details = Writes the BIOS boot code to a new USB drive.

[setting media:MEDIA_LABEL]
summary = Volume label of the USB drive and the ISO
details = Also used to find the new USB volume after formatting. FAT32 allows at most 11 characters.

[setting media:USB_FS]
summary = File system of a new USB drive
details = FAT32 boots on UEFI and BIOS PCs and is formatted at any size. Many UEFI firmwares do not boot from exFAT.
choice fat32 = boots everywhere (recommended)
choice exfat = files over 4 GB, but many PCs do not boot from it

[setting media:USB_PART_MB]
summary = USB partition size in MB (empty = whole disk)
details = Use e.g. 32000 if formatting a drive over 32 GB as FAT32 fails on an old Windows build.

; ============================================================
; data\test\test_config.cmd
; ============================================================

[setting FTP_HOST]
summary = FTP server for the test reports
details = IP address or host name, e.g. 192.168.0.10. Required for the test image.

[setting FTP_PORT]
summary = FTP port
details = Default 21.

[setting FTP_USER]
summary = FTP account
details = Required. Do not use ! or "; write % as %%.

[setting FTP_PASS]
summary = FTP password
details = Stored as plain text in the test image. Use an account that can only write the report folder.

[setting FTP_DIR]
summary = Remote folder for the reports
details = Relative to the login folder, no spaces. Empty = the login folder.

[setting FTP_CLIENT]
summary = FTP program used in WinPE
choice auto = curl.exe first, then ftp.exe
choice curl = curl.exe only
choice ftp = ftp.exe only (always active mode)

[setting FTP_PASSIVE]
summary = FTP mode of curl.exe
details = ftp.exe always uses active mode.
choice 1 = passive (works through most firewalls)
choice 0 = active

[setting FTP_TIMEOUT_SEC]
summary = curl.exe: connect timeout (seconds)

[setting FTP_MAX_TIME_SEC]
summary = curl.exe: maximum time per upload (seconds)

[setting FTP_RETRIES]
summary = Upload attempts

[setting FTP_RETRY_SEC]
summary = Wait between upload attempts (seconds)

[setting TEST_DONE_REBOOT_SEC]
summary = Seconds before the reboot after a passed test

[setting TEST_FAIL_REBOOT]
summary = After a failed test
choice 1 = reboot after FAIL_REBOOT_SEC
choice 0 = keep the red screen until a key is pressed

[setting TEST_UPLOAD_FAIL]
summary = Upload a report when the test fails
details = Only when an IP address was set.
choice 0 = upload only on success
choice 1 = also upload <ip>_FAIL.txt on failure

[setting TEST_FAIL_SUFFIX]
summary = Name suffix of a failure report
details = <ip><suffix>.txt, e.g. 192.168.0.21_FAIL.txt

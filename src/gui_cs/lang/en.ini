; ============================================================
;  DVT GUI - English language file (lang\en.ini)
;  The complete reference: every other language file falls back to
;  this one for anything it does not contain.
;
;  key = text           one line of text
;  key += text          adds one more line to the text above
;  {0}, {1} ...         filled in by the program; keep them
;  Lines starting with ; are comments. Save the file as UTF-8.
;
;  To add a language: copy this file to lang\<code>.ini (e.g. ja.ini),
;  change [meta] and translate the text after the = signs.
; ============================================================


[setting media:BOOTSECT]
summary = 보관한 bootsect.exe
details = 새 USB 드라이브에 BIOS 부팅 코드를 씁니다.

[setting media:MEDIA_LABEL]
summary = USB 드라이브와 ISO의 볼륨 이름
details = 포맷 뒤 새 USB 볼륨을 찾는 데도 씁니다. FAT32는 최대 11자입니다.

[setting media:USB_FS]
summary = 새 USB 드라이브의 파일 시스템
details = FAT32는 UEFI와 BIOS PC 모두에서 부팅되며 크기와 관계없이 포맷됩니다. exFAT로는 부팅하지 못하는 UEFI 펌웨어가 많습니다.
choice fat32 = 어디서나 부팅 (권장)
choice exfat = 4 GB 넘는 파일 가능, 부팅 안 되는 PC 많음

[setting media:USB_PART_MB]
summary = USB 파티션 크기(MB, 비우면 디스크 전체)
details = 오래된 윈도우 빌드에서 32 GB 넘는 드라이브를 FAT32로 포맷하지 못하면 예를 들어 32000 을 쓰세요.

; ---------- data\test\test_config.cmd ----------

[setting FTP_HOST]
summary = 테스트 보고서를 받을 FTP 서버
details = IP 주소 또는 호스트 이름(예: 192.168.0.10). 테스트 이미지에 꼭 필요합니다.

[setting FTP_PORT]
summary = FTP 포트
details = 기본값 21.

[setting FTP_USER]
summary = FTP 계정
details = 꼭 필요합니다. ! 와 " 는 쓸 수 없고 % 는 %% 로 쓰세요.

[setting FTP_PASS]
summary = FTP 비밀번호
details = 테스트 이미지에 평문으로 저장됩니다. 보고서 폴더에 쓰기만 할 수 있는 계정을 쓰세요.

[setting FTP_DIR]
summary = 보고서를 올릴 원격 폴더
details = 로그인 폴더 기준, 공백 없이. 비우면 로그인 폴더.

[setting FTP_CLIENT]
summary = WinPE에서 쓸 FTP 프로그램
choice auto = curl.exe 먼저, 다음 ftp.exe
choice curl = curl.exe 만
choice ftp = ftp.exe 만 (항상 액티브 모드)

[setting FTP_PASSIVE]
summary = curl.exe 의 FTP 모드
details = ftp.exe 는 항상 액티브 모드를 씁니다.
choice 1 = 패시브 (대부분의 방화벽 통과)
choice 0 = 액티브

[setting FTP_TIMEOUT_SEC]
summary = curl.exe: 연결 제한 시간(초)

[setting FTP_MAX_TIME_SEC]
summary = curl.exe: 업로드 한 번의 최대 시간(초)

[setting FTP_RETRIES]
summary = 업로드 시도 횟수

[setting FTP_RETRY_SEC]
summary = 업로드 시도 사이 대기(초)

[setting TEST_DONE_REBOOT_SEC]
summary = 테스트 통과 뒤 재부팅까지 대기(초)

[setting TEST_FAIL_REBOOT]
summary = 테스트 실패 뒤
choice 1 = FAIL_REBOOT_SEC 뒤 재부팅
choice 0 = 키를 누를 때까지 빨간 화면 유지

[setting TEST_UPLOAD_FAIL]
summary = 테스트가 실패해도 보고서 업로드
details = IP 주소가 설정된 경우에만.
choice 0 = 성공했을 때만 업로드
choice 1 = 실패하면 <ip>_FAIL.txt 도 업로드

[setting TEST_FAIL_SUFFIX]
summary = 실패 보고서 이름 뒤에 붙는 문자
details = <ip><접미사>.txt (예: 192.168.0.21_FAIL.txt)

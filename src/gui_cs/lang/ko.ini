[setting pe:IP_FILE]
summary = WinPE 안의 고정 IP 파일
details = 고정 IP일 때만 make_boot.bat 이 복사합니다. 그대로 두세요.

[setting RESTORE_FLAG]
summary = 표시 파일: 다운로드 완료
details = 내부용. 그대로 두세요.

[setting ARIA2]
summary = WinPE의 aria2c.exe 경로
details = X:\restore 를 먼저, 다음에 System32를 찾습니다. 그대로 두세요.

[setting WIMLIB]
summary = WinPE의 wimlib-imagex.exe 경로
details = X:\restore 를 먼저, 다음에 System32를 찾습니다. 그대로 두세요.

[setting NIRCMD]
summary = WinPE의 nircmd.exe 경로
details = X:\restore 를 먼저, 다음에 System32를 찾습니다. 그대로 두세요.

[setting pe:FORCE_DISK]
summary = 지울 디스크 번호 (비우면 자동)
details = 위험. 비우면 디스크 ID로 윈도우 디스크를 찾습니다(권장).
details += 번호를 넣으면 '모든' 클라이언트에서 그 디스크를 지웁니다. 모든 PC의 디스크 구성이 같을 때만 쓰세요.

[setting pe:DISK_ID_FILE]
summary = WinPE 안의 디스크 ID 파일
details = make_boot.bat 이 씁니다. data\host\config.cmd 의 DISK_ID_NAME 과 같게 유지하세요.

[setting pe:AUTO_DISK_FALLBACK]
summary = 디스크 ID와 맞는 디스크가 없을 때
details = 순간복구 프로그램은 실제 디스크 ID를 숨기고 WinPE에서 윈도우 파티션을 RAW로 보이게 할 수 있습니다.
choice 1 = 하나뿐인 RAW 볼륨의 디스크, 또는 하나뿐인 디스크 사용
choice 0 = 중단: 디스크 ID(또는 FORCE_DISK)가 꼭 필요

[setting TDRV]
summary = WinPE에서 새 윈도우 파티션의 드라이브 문자
details = 다운로드에도 씁니다. 다른 드라이브와 겹치지 않으면 그대로 두세요.

[setting SDRV]
summary = WinPE에서 새 시스템(부팅) 파티션의 드라이브 문자
details = 다른 드라이브와 겹치지 않으면 그대로 두세요.

[setting EFI_SIZE_MB]
summary = EFI 시스템 파티션 크기(UEFI, MB)
details = 기본값 260 (4K 섹터 디스크에도 맞음).

[setting MSR_SIZE_MB]
summary = Microsoft 예약 파티션 크기(UEFI, MB)

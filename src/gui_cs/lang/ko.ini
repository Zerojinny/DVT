[setting BIOS_SYS_SIZE_MB]
summary = 시스템 파티션 크기(BIOS / MBR, MB)
details = 기본값 500.

[setting NET_MASK]
summary = ip.txt 에 없을 때 쓸 서브넷 마스크
details = ip.txt 에 2줄이 없을 때만 씁니다.

[setting NET_DNS1]
summary = ip.txt 에 없을 때 쓸 DNS 서버 1
details = ip.txt 에 DNS 줄(4-5줄)이 없을 때만 씁니다.

[setting NET_DNS2]
summary = ip.txt 에 없을 때 쓸 DNS 서버 2
details = ip.txt 에 DNS 줄(4-5줄)이 없을 때만 씁니다.

[setting NET_TEST_HOST]
summary = 응답해야 하는 추가 호스트 (ping)
details = 고정 IP 랜카드를 쓰기 전에 게이트웨이 외에 이 호스트도 응답해야 합니다. 인터넷 주소가 아니라 트래커나 시더 주소를 쓰세요. 비우면 게이트웨이만 확인합니다.

[setting SET_IP_RETRIES]
summary = 고정 IP: 모든 랜카드를 다시 시도할 횟수
details = 게이트웨이에 닿는 랜카드가 없으면 모든 랜카드를 이 횟수만큼 다시 시도합니다.

[setting SET_IP_RETRY_SEC]
summary = 고정 IP: 다시 시도 사이 대기(초)

[setting DHCP_WAIT_TRIES]

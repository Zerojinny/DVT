[setting CHECK_FILE]
summary = 토렌트 안의 작은 점검용 파일
details = 무엇을 지우기 전에 이 파일을 먼저 받아 시더가 응답하는지 확인합니다. 토렌트를 만들기 전에 DL_NAME 폴더에 넣으세요(몇 KB, 빈 파일이면 안 됨).

[setting SEEDER_TIMEOUT_SEC]
summary = 시더 점검: 한 번 시도의 제한 시간(초)
details = 한 번 시도할 때 시더에서 점검 파일을 기다리는 시간입니다.

[setting SEEDER_TRIES_1G]
summary = 시더 점검: 1 Gbps 링크의 시도 횟수

[setting SEEDER_TRIES_100]
summary = 시더 점검: 100 Mbps 이하 또는 알 수 없을 때 시도 횟수

[setting SEEDER_LOG]

; ============================================================
;  config.cmd 설정 설명
;  [setting <파일>:<이름>] 이 [setting <이름>] 보다 먼저 쓰입니다.
;  선택지의 값(choice 뒤의 값)과 advanced 는 en.ini 를 따르므로
;  여기서는 문구만 번역합니다.
; ============================================================

; ---------- data\host\config.cmd ----------

[setting host:WORK_DIR]
summary = 클라이언트 PC의 작업 폴더
details = make_boot.bat 이 이 폴더에서 토렌트를 찾고, ip.txt, 추출한 네트워크 드라이버, 부팅 항목 ID를 이 폴더에 둡니다.
details += 기본값 C:\temp. 모든 클라이언트에서 DVT_backup.torrent 를 이 폴더에 복사하세요.

[setting host:BOOT_WIM]
summary = 클라이언트가 한 번 부팅할 WinPE 이미지
details = make_boot.bat 옆의 boot.wim (C:\temp\boot 또는 C:\temp\boot_test). make_boot.bat 이 여기에 드라이버, IP, 토렌트, 디스크 ID를 넣습니다.

[setting host:TORRENT]
summary = 이미지에 넣을 토렌트 파일
details = make_boot.bat 이 이 파일을 boot.wim 에 복사합니다. 기본값: C:\temp\DVT_backup.torrent
details += 파일이 없으면 make_boot.bat 이 중단됩니다.

[setting host:IP_FILE]
summary = 클라이언트에서 만드는 고정 IP 파일
details = 클라이언트가 고정 IP를 쓸 때만 만들어 이미지에 복사합니다. DHCP이면 파일을 만들지 않고 WinPE도 DHCP를 씁니다.
details += 1줄 = IP, 2줄 = 서브넷, 3줄 = 게이트웨이, 4-5줄 = DNS 서버

[setting host:NETDRV_DIR]
summary = 추출한 네트워크 드라이버 폴더
details = 실행 중인 윈도우의 네트워크 드라이버를 여기로 추출해 boot.wim 에 넣으므로 WinPE도 같은 랜카드를 쓸 수 있습니다. 실행할 때마다 비웁니다.

[setting host:NETDRV_EXCLUDE]
summary = 추출하지 않을 네트워크 드라이버
details = 제조사와 장치 이름에 맞춰 보는 PowerShell 정규식입니다. 여러 개는 | 로 구분합니다(예: Realtek|Killer).
details += 기본값 Realtek: 윈도우용 Realtek 드라이버는 WinPE에서 연결이 끊길 수 있어 drivers 폴더의 WinPE용 드라이버를 대신 씁니다.
details += 비우면 모든 네트워크 드라이버를 추출합니다.

[setting host:BOOT_MOUNT_DIR]
summary = boot.wim 을 마운트할 로컬 폴더
details = 로컬 NTFS 드라이브에 있어야 하며 OneDrive, Dropbox 등이 동기화하는 폴더면 안 됩니다. 남아 있는 마운트는 먼저 정리합니다.

[setting host:DISK_ID_NAME]
summary = 이미지 안 디스크 ID 파일 이름
details = 윈도우 디스크의 ID(GPT GUID 또는 MBR 서명)를 restore\<이 이름> 에 씁니다. WinPE는 이 ID의 디스크를 지웁니다. data\pe\config.cmd 의 DISK_ID_FILE 과 같게 유지하세요.

[setting host:BITLOCKER_SUSPEND]
summary = BitLocker를 재시작 1회 동안 일시 중단
details = WinPE의 점검이 실패하면 PC는 원래 윈도우로 돌아갑니다. 재시작 1회 동안 BitLocker를 일시 중단하면 그때 복구 키를 묻지 않습니다. 보호는 저절로 다시 켜집니다.
choice 1 = 재시작 1회 동안 일시 중단 (권장)
choice 0 = BitLocker를 그대로 둠

[setting host:BOOT_ENTRY_NAME]
summary = 1회용 부팅 메뉴 항목 이름
details = 클라이언트가 WinPE로 재시작할 때 윈도우 부팅 메뉴에 표시됩니다.

[setting host:BOOT_MENU_TIMEOUT]
summary = 부팅 메뉴 대기 시간(초)
details = 클라이언트에서 'bcdedit /timeout' 으로 설정합니다. 그 PC의 윈도우 부팅 관리자 대기 시간입니다.

[setting host:BCD_CLEANUP_MODE]
summary = 1회용 부팅 항목을 지우는 방법
details = 이 항목은 WinPE를 한 번 부팅합니다. 그 뒤에 누가 항목을 지울지 정합니다.
choice 2 = 다음 윈도우 부팅 때 (예약 작업, 이미지 변경 없음)
choice 1 = WinPE 안에서 (startnet.cmd 에 명령 추가)
choice 0 = 지우지 않음

[setting host:BCD_TASK_NAME]
summary = 정리용 예약 작업 이름
details = BCD_CLEANUP_MODE=2 일 때만 씁니다. 이 작업은 다음 시작 때 부팅 항목을 지우고 자기 자신도 지웁니다.

[setting host:BCD_GUID_FILE]
summary = 부팅 항목 ID를 보관하는 파일
details = 나중에 make_boot.bat 을 다시 실행할 때 이전 DVT 부팅 항목을 찾아 교체하는 데 씁니다.

[setting host:REBOOT_DELAY_SEC]
summary = 클라이언트가 WinPE로 재시작하기 전 대기(초)
details = IP를 크게 표시한 뒤 키를 누르면 재시작합니다. 'shutdown /r' 의 대기 시간입니다.

[setting host:ADK_PE_DIR]
summary = Windows ADK의 WinPE 폴더
details = source\winpe.wim 과 source\boot.sdi 가 아직 없을 때(첫 빌드)만 씁니다. ADK를 다른 폴더에 설치했다면 바꾸세요.

[setting host:PE_LANG]
summary = ADK에서 winpe.wim 을 가져올 언어 폴더
details = 첫 빌드 때만 읽습니다. 바꾸려면 source\winpe.wim 을 지워 ADK에서 새로 복사하게 하세요.
choice en-us = 영어 (기본값)
choice ko-kr = 한국어

[setting host:PE_SRC_DIR]
summary = 클라이언트 로컬부팅용 WinPE 스크립트
details = 이미지의 X:\restore 로 복사됩니다. 그대로 두세요.

[setting host:PE_COMMON_DIR]
summary = 모든 이미지가 함께 쓰는 WinPE 스크립트
details = PE_SRC_DIR 다음에 X:\restore 로 복사됩니다. 그대로 두세요.

[setting host:PE_COMMON_FILES]
summary = PE_COMMON_DIR 에 꼭 있어야 하는 파일
details = 빌드 전에 확인합니다. 그대로 두세요.

[setting host:PE_TOOLS_DIR]
summary = WinPE(X:\restore)로 복사할 도구
details = aria2c.exe, wimlib-imagex.exe, libwim-15.dll, nircmd.exe(x64)를 여기에 둡니다(WinPE 도구 탭이 여기로 받음). aria2c.exe, wimlib-imagex.exe, nircmd.exe 중 하나라도 없으면 빌드가 중단됩니다.

[setting host:PE_SYS32_DIR]
summary = X:\Windows\System32 로 복사할 추가 파일
details = WinPE의 PATH에서 찾을 수 있어야 하는 파일. 폴더가 없어도 됩니다.

[setting host:PE_DRIVERS_DIR]
summary = 모든 WinPE 이미지에 넣을 드라이버
details = 이 폴더 아래의 .inf 드라이버를 모두 DISM으로 넣습니다(예: WinPE용 Realtek 드라이버). 클라이언트별 네트워크 드라이버는 나중에 make_boot.bat 이 넣습니다.

[setting host:NIRCMD_SRC]
summary = X:\Windows\System32 로 복사할 nircmd.exe (x64)
details = WinPE에서 메시지 표시와 aria2c 종료에 씁니다. 꼭 필요합니다. 다른 도구와 함께 PE_TOOLS_DIR 에 둡니다(WinPE 도구 탭이 여기로 받음). v0.3.0 이전에는 nircmd-x64\ 에 있었습니다.

[setting host:SOURCE_DIR]
summary = 보관해 둔 깨끗한 ADK 파일
details = winpe.wim, boot.sdi, adk_media, adk_tools. 첫 빌드 뒤에는 ADK가 필요 없습니다. 여기서 파일을 지우면 ADK에서 다시 복사합니다.

[setting host:OUT_ROOT]
summary = 모든 빌드 저장 폴더
details = 여기에 _output\boot, _output\boot_test, _output\media 가 만들어집니다.

[setting host:OUT_DIR]
summary = 01_make_pe.bat 의 결과
details = boot.wim, boot.sdi, 클라이언트 스크립트. 이 폴더를 클라이언트의 C:\temp\boot 로 복사하세요.

[setting host:BUILD_LOCAL]
summary = 빌드용 로컬 작업 폴더
details = 마운트·작업 폴더. 로컬 드라이브에 있어야 하며 동기화 폴더면 안 됩니다(동기화 프로그램이 지운 파일을 되살릴 수 있음).

[setting host:PE_SCRATCH_MB]
summary = WinPE 임시 공간(MB)

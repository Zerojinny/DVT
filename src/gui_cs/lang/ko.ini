[setting mediape:LINK_EXE]
summary = WinPE 안의 link.exe
details = 링크 속도에 따라 aria2.conf.1G 또는 aria2.conf.100 을 고릅니다. 그대로 두세요.

[setting mediape:LINK_FALLBACK]

[setting SEEDER_EXTRA_OPTS]
summary = 시더 점검용 aria2c 추가 옵션
details = 예: --bt-tracker=http://192.168.0.10:9000/announce

[setting SPACE_CHECK]
summary = 지우기 전 디스크 공간 점검
details = 디스크 크기를 이미지 크기(APPLIED_SIZE_MB 또는 추정치) + SPACE_MARGIN_MB 와 비교합니다.
choice 1 = 디스크가 작으면 중단
choice 2 = 경고만
choice 0 = 점검 안 함

[setting APPLIED_SIZE_MB]
summary = 복원 후 이미지 크기(MB, 비우면 추정)
details = 정확한 값: 'wimlib-imagex info backup.wim 1' 을 실행해 Total Bytes / 1048576 을 쓰세요.

[setting APPLIED_SIZE_PCT]
summary = 추정: 다운로드 크기의 몇 %
details = APPLIED_SIZE_MB 가 비어 있을 때 씁니다. 200 = 압축된 이미지의 두 배.

[setting SPACE_MARGIN_MB]
summary = 윈도우 파티션에 남겨 둘 여유 공간(MB)

[setting BCD_LOCALE]

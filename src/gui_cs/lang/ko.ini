[setting DL_NAME]
summary = 토렌트 안의 최상위 폴더 이름
details = 토렌트를 만든 폴더 이름과 같아야 합니다(기본값 DVT_backup). WinPE는 <드라이브>:\DL_NAME 으로 다운로드합니다.

[setting WIM_NAME]

choice en-us = 영어

[setting FAIL_REBOOT_SEC]
summary = 실패 뒤 재부팅까지 대기(초)
details = 아직 아무것도 지우지 않았다면 PC는 원래 윈도우로 돌아갑니다.

[setting DONE_REBOOT_SEC]
summary = 복원 뒤 재부팅까지 대기(초)

[setting COLOR_WORK]

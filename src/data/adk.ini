; ============================================================
;  DVT GUI - adk.ini : data of the "Windows ADK" page
;
;  Embedded in DVT_GUI.exe by build_gui.bat. A copy of this file in
;  gui_cs\ (or next to DVT_GUI.exe) replaces the embedded one, so a
;  release can be added or changed without rebuilding.
;
;  The download method and most links and hashes come from
;  p0w3rsh3ll/ADK (https://github.com/p0w3rsh3ll/ADK, MIT License,
;  (c) Emin Atac); the direct links come from the Microsoft page
;  https://learn.microsoft.com/windows-hardware/get-started/adk-install
;
;  A downloaded setup must be signed by Microsoft. Its SHA256 hash is
;  looked up in the [release ...] and [known ...] sections to name its
;  version; a file of another release or with an unknown hash is only
;  used after the user agrees.
; ============================================================

[download]
; page opened by "Microsoft ADK page"
info_page = https://learn.microsoft.com/windows-hardware/get-started/adk-install

[install]
; features installed: DVT needs only these two
adk_features = OptionId.DeploymentTools
pe_features = OptionId.WindowsPreinstallationEnvironment

; ---- releases offered in "Version to install": [release <version>] ----
;   name          = shown in the list
;   adk_folder    = root link: redirects to the download folder that
;                   holds adksetup.exe (tried first)
;   pe_folder     = root link of the folder with adkwinpesetup.exe
;   adk_file      = direct link to adksetup.exe (tried when the
;                   folder link fails)
;   pe_file       = direct link to adkwinpesetup.exe
;   adksetup      = SHA256 of adksetup.exe
;   adkwinpesetup = SHA256 of adkwinpesetup.exe
;   latest        = 1: the links always lead to the newest release
;                   (a newer file has an unknown hash and is shown)
;  Hashes checked on 2026-10-26: every setup downloaded from these links,
;  Microsoft Authenticode signature valid, product version = section name.
;  Only x64 releases from Windows 10 1809 on (the first with a
;  separate WinPE add-on). Not listed: 10.1.28000.1 (Arm64 only),
;  10.1.22000.1 (withdrawn by Microsoft), 10.1.26100.1 and
;  10.1.26100.2454 (links no longer work; see [known ...] below).


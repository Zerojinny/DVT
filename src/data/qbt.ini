; ============================================================
;  DVT GUI - qbt.ini : data of the "qBittorrent (seeder)" tab
;
;  Read from data\ at start (embedded in DVT_GUI.exe by build_gui.bat),
;  so it can be changed without rebuilding.
;
;  The tab downloads the standard qBittorrent build (libtorrent 2.x),
;  unpacks the setup with 7-Zip into a temporary folder (nothing is
;  installed in Windows), copies only the program files to
;  <build>\<folder>, creates the "profile" folder next to qbittorrent.exe
;  (qBittorrent portable mode, qBittorrent 4.2.1 or later) and copies the
;  ready-made settings file for the link speed of this PC to
;  <folder>\profile\qBittorrent\config\qBittorrent.ini, with the IP
;  address and the network adapter of this PC (bind address, interface,
;  tracker URL of the torrent creator).
;  No signature or hash check is made.
; ============================================================

[download]
; release list of the Windows builds: the folder list of SourceForge
; (qbittorrent-<version>); the newest stable version (no rc / beta) is
; taken from it. The RSS list also works:
;   https://sourceforge.net/projects/qbittorrent/rss?path=/qbittorrent-win32&limit=200
list = https://sourceforge.net/projects/qbittorrent/files/qbittorrent-win32/
; download address, {0} = version
url = https://downloads.sourceforge.net/project/qbittorrent/qbittorrent-win32/qbittorrent-{0}/qbittorrent_{0}_x64_setup.exe
; the download must end on one of these https hosts (sub-domains included)
hosts = sourceforge.net
; used when the release list cannot be read
fallback_version = 5.3.0
; page opened by "Website"
home = https://www.qbittorrent.org/download

[install]
; folder in the build folder (next to data\)
folder = qbittorrent
; files copied from the unpacked setup (wildcards allowed; NSIS files such
; as $PLUGINSDIR and uninst.exe are not copied)
files = qbittorrent.exe qbittorrent.pdb *.dll qt.conf
; sub-folders copied when present
folders = translations

[7zip]
; used only when 7-Zip is not installed: 7zr.exe unpacks 7z.exe and 7z.dll
; from the 7-Zip setup into _output\qbt_download\7zip
7zr = https://github.com/ip7z/7zip/releases/download/26.05/7zr.exe
setup = https://github.com/ip7z/7zip/releases/download/26.05/7z2605-x64.exe
hosts = github.com githubusercontent.com

[profiles]
; ready-made settings files (doc\qbittorrent.ini), relative to the build folder
1g = doc\qbittorrent.ini\qbittorrent.ini.1G
100 = doc\qbittorrent.ini\qbittorrent.ini.100
; link speed (Mbps) from which the 1G file is used
threshold_mbps = 1000
; port of the embedded tracker, used when TrackerList is empty
tracker_port = 9000
